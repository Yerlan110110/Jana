[project]
name = "janamen-backend"
version = "0.1.0"
description = "JanaMen employee services API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "Django>=5.2.18,<5.3",
  "djangorestframework>=3.16,<4",
  "drf-spectacular>=0.28,<1",
  "django-filter>=25,<27",
  "django-cors-headers>=4.7,<5",
  "dj-database-url>=2.3,<4",
  "psycopg[binary]>=3.2,<4",
  "gunicorn>=23,<25",
  "whitenoise>=6.9,<7",
  "rank-bm25>=0.2.2,<0.3",
  "snowballstemmer>=3,<4",
  "openai>=2,<3",
  "pydantic>=2.14,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-django>=4.10,<5", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["apps"]
addopts = "--strict-markers"
filterwarnings = ["error::pytest.PytestWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["ALL"]
