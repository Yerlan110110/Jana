name: janamen

x-app: &app
  build:
    context: .
    target: runtime
  image: janamen-backend:local
  environment: &environment
    DATABASE_URL: postgresql://janamen:${POSTGRES_PASSWORD:?Run python scripts/dev.py prepare first}@db:5432/janamen
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Run python scripts/dev.py prepare first}
    DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    DEMO_PASSWORD: ${DEMO_PASSWORD:?Run python scripts/dev.py prepare first}
    DEMO_SEED: ${DEMO_SEED:-true}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_MODEL: ${OPENAI_MODEL:-}
  volumes:
    - static_data:/app/staticfiles
    - runtime_data:/app/runtime

services:
  db:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_DB: janamen
      POSTGRES_USER: janamen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/dev.py prepare first}
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U janamen -d janamen"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  release:
    <<: *app
    command: ["release"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    command: ["api"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      release:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready/', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4
    restart: unless-stopped

  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      release:
        condition: service_completed_successfully
    restart: unless-stopped

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      <<: *environment
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: testserver,localhost,127.0.0.1
    depends_on:
      db:
        condition: service_healthy

volumes:
  database_data:
  static_data:
  runtime_data:
