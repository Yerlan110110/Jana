components:
  schemas:
    AcademyVersionCommandRequest:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
      required:
      - expected_version
    Answer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        client_message_id:
          type: string
          format: uuid
        question:
          type: string
        language:
          $ref: '#/components/schemas/LanguageEnum'
        mode:
          $ref: '#/components/schemas/ModeEnum'
        answer_strategy:
          $ref: '#/components/schemas/AnswerStrategyEnum'
        reason:
          type: string
        message:
          type: string
        claims:
          type: array
          items:
            $ref: '#/components/schemas/AnswerClaim'
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
        evidence_status:
          $ref: '#/components/schemas/EvidenceStatusEnum'
        provider:
          type: string
        model:
          type: string
        case_id:
          type: string
          format: uuid
          nullable: true
        allowed_actions:
          type: array
          items:
            $ref: '#/components/schemas/AnswerAllowedActionsEnum'
        created_at:
          type: string
          format: date-time
      required:
      - allowed_actions
      - answer_strategy
      - case_id
      - citations
      - claims
      - client_message_id
      - created_at
      - evidence_status
      - id
      - language
      - message
      - mode
      - model
      - provider
      - question
      - reason
    AnswerAllowedActionsEnum:
      enum:
      - ask_again
      - escalate_to_hr
      - open_hr_case
      type: string
      description: |-
        * `ask_again` - ask_again
        * `escalate_to_hr` - escalate_to_hr
        * `open_hr_case` - open_hr_case
    AnswerClaim:
      type: object
      properties:
        text:
          type: string
        supports:
          type: array
          items:
            $ref: '#/components/schemas/ClaimSupport'
      required:
      - supports
      - text
    AnswerStrategyEnum:
      enum:
      - source_bound_selection
      - ranked_excerpts
      - refusal
      - unavailable
      type: string
      description: |-
        * `source_bound_selection` - source_bound_selection
        * `ranked_excerpts` - ranked_excerpts
        * `refusal` - refusal
        * `unavailable` - unavailable
    AssignmentRequest:
      type: object
      properties:
        employee:
          type: string
          format: uuid
        course_version:
          type: string
          format: uuid
        required:
          type: boolean
          default: true
        due_at:
          type: string
          format: date-time
          nullable: true
      required:
      - course_version
      - employee
    AttemptCommandRequest:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
        answers:
          type: array
          items:
            $ref: '#/components/schemas/QuizAnswerRequest'
      required:
      - answers
      - expected_version
    AttemptDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        number:
          type: integer
          readOnly: true
        correct_count:
          type: integer
          readOnly: true
        question_count:
          type: integer
          readOnly: true
        score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
        passing_percent:
          type: integer
          readOnly: true
        passed:
          type: boolean
          readOnly: true
        material_completed:
          type: boolean
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
        answers:
          type: array
          items:
            $ref: '#/components/schemas/QuizAnswer'
          readOnly: true
      required:
      - answers
      - correct_count
      - id
      - material_completed
      - number
      - passed
      - passing_percent
      - question_count
      - score
      - submitted_at
    AttemptResult:
      type: object
      properties:
        attempt:
          $ref: '#/components/schemas/AttemptDetail'
        enrollment:
          $ref: '#/components/schemas/EnrollmentDetail'
      required:
      - attempt
      - enrollment
    AttemptSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        number:
          type: integer
          readOnly: true
        correct_count:
          type: integer
          readOnly: true
        question_count:
          type: integer
          readOnly: true
        score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
        passing_percent:
          type: integer
          readOnly: true
        passed:
          type: boolean
          readOnly: true
        material_completed:
          type: boolean
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - correct_count
