  /api/v1/ready/:
    get:
      operationId: ready_retrieve
      tags:
      - ready
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/requests/:
    get:
      operationId: requests_list
      parameters:
      - in: query
        name: employee
        schema:
          type: string
          format: uuid
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - advance
          - leave
        description: |-
          * `leave` - Leave
          * `advance` - Salary advance
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - approved
          - cancelled
          - draft
          - pending_hr
          - pending_manager
          - rejected
          - returned
        description: |-
          * `draft` - Draft
          * `pending_manager` - Pending manager
          * `pending_hr` - Pending HR
          * `approved` - Approved
          * `rejected` - Rejected
          * `returned` - Returned for changes
          * `cancelled` - Cancelled
      tags:
      - requests
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRequestList'
          description: ''
    post:
      operationId: requests_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Unique command key per authenticated user. Replays return the
          original result.
        required: true
      tags:
      - requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RequestCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RequestCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDetail'
          description: ''
  /api/v1/requests/{id}/:
    get:
      operationId: requests_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this hr request.
        required: true
      tags:
      - requests
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDetail'
          description: ''
    patch:
      operationId: requests_partial_update
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Unique command key per authenticated user. Replays return the
          original result.
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this hr request.
        required: true
      tags:
      - requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRequestEditRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRequestEditRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRequestEditRequest'
      security:
      - cookieAuth: []
