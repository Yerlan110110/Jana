    post:
      operationId: assistant_answers_create
      description: client_message_id deduplicates the persisted answer. A new id asks
        again. Extractive mode does not call an LLM. Provider failures return 503
        with the persisted answer in the answer field.
      tags:
      - AI Jana
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionRequest'
          application/x-www-form-urlencoded:
