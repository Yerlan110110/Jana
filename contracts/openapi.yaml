openapi: 3.0.3
info:
  title: JanaMen API
  version: 1.0.0
  description: Employee services with synthetic demonstration data.
paths:
  /api/v1/academy/courses/:
    get:
      operationId: academy_courses_list
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - communication
          - hr
          - information_security
          - knowledge
          - logistics
          - team
        description: |-
          * `hr` - Кадровые действия
          * `logistics` - Логистические данные
          * `communication` - Общение
          * `information_security` - Доступ и информация
          * `team` - Руководитель и HR
          * `knowledge` - Регламенты и знания
      - in: query
        name: language
        schema:
          type: string
          enum:
          - kk
          - ru
        description: |-
          * `ru` - Русский
          * `kk` - Қазақша
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - academy
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCatalogCourseList'
          description: ''
  /api/v1/academy/courses/{id}/:
    get:
      operationId: academy_courses_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this course.
        required: true
      tags:
      - academy
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogCourse'
          description: ''
  /api/v1/academy/enrollments/:
