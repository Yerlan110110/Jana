components:
  schemas:
    CSRF:
      type: object
      properties:
        csrf_token:
          type: string
      required:
      - csrf_token
    CurrencyEnum:
      enum:
      - KZT
      type: string
      description: '* `KZT` - KZT'
    DecisionRequest:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
        comment:
          type: string
          default: ''
          maxLength: 2000
      required:
      - expected_version
    Department:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 200
        legal_entity:
          type: string
          format: uuid
      required:
      - code
      - id
      - legal_entity
      - name
    Employee:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        external_id:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        position:
          type: string
          readOnly: true
        legal_entity:
          allOf:
          - $ref: '#/components/schemas/LegalEntity'
          readOnly: true
        department:
          allOf:
          - $ref: '#/components/schemas/Department'
          readOnly: true
        manager:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        manager_name:
          type: string
          readOnly: true
        hired_on:
          type: string
          format: date
          readOnly: true
        leave_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
          readOnly: true
        balance_as_of:
          type: string
          format: date
          readOnly: true
        locale:
          allOf:
          - $ref: '#/components/schemas/LocaleEnum'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        source_revision:
          type: string
          readOnly: true
        synced_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - balance_as_of
      - department
      - external_id
      - full_name
      - hired_on
      - id
      - is_active
      - leave_balance
      - legal_entity
      - locale
      - manager
      - manager_name
      - position
      - source_revision
      - synced_at
      - user
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    KindEnum:
      enum:
      - leave
      - advance
      type: string
      description: |-
        * `leave` - Leave
        * `advance` - Salary advance
    LeaveProjection:
      type: object
      properties:
        official_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,2})?$
        portal_reserved_days:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,2})?$
        projected_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,2})?$
        balance_as_of:
          type: string
          format: date
        day_count_convention:
          type: string
      required:
      - balance_as_of
      - day_count_convention
      - official_balance
      - portal_reserved_days
      - projected_balance
    LegalEntity:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 200
      required:
      - code
      - id
      - name
    LocaleEnum:
      enum:
      - ru
      - kk
      type: string
      description: |-
        * `ru` - Русский
        * `kk` - Қазақша
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 256
      required:
      - password
      - username
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          type: string
          readOnly: true
        title:
          type: string
          readOnly: true
        body:
          type: string
          readOnly: true
        target_type:
          type: string
          readOnly: true
        target_id:
          type: string
          format: uuid
          readOnly: true
        read_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - body
      - created_at
      - id
      - kind
      - read_at
      - target_id
      - target_type
      - title
    PaginatedDepartmentList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Department'
    PaginatedEmployeeList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Employee'
    PaginatedLegalEntityList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/LegalEntity'
    PaginatedNotificationList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
    PaginatedRequestList:
      type: object
      required:
      - count
